name: Release APK

# Mirrors the release flow used for MaterialChat: bump, tag, build, publish —
# with one difference. MaterialChat always has signing secrets available; this
# repository may not, so signing is detected rather than assumed. With
# KEYSTORE_BASE64 set the release is properly signed, and without it the build
# falls back to the debug-signed APK and says so in the release notes instead of
# publishing something that will not install.
#
# Every action is pinned to a commit SHA rather than a major tag. A tag is a
# moving reference owned by whoever owns the action, and this job holds the
# release signing key: "v5 today, something else tomorrow" is a supply-chain
# hole, not a convenience. The trailing comment names the tag the SHA was taken
# from, so a bump is a two-line change.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (ignored when a pre-release suffix is given)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]
      version_suffix:
        description: 'Pre-release suffix, e.g. beta.1 — leave empty for a stable release'
        required: false
        default: 'beta.1'
        type: string
      prerelease:
        description: 'Publish as a pre-release (beta)?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      release_notes:
        description: 'Release notes (what changed in this version)'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action defaults to `tools platform-tools`, and Google has removed
          # the legacy `tools` package from the SDK repository, which makes
          # sdkmanager exit 1. The platform and build tools we actually need are
          # installed explicitly in the next step.
          packages: platform-tools

      - name: Install the platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect a signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — publishing the debug-signed APK."
          fi

      - name: Read the current version and work out the next one
        id: version
        run: |
          CURRENT_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # A previous run may have left a pre-release suffix in place, so the
          # numeric bump is computed from the base version and never from
          # something like `1.0.0-beta.1`, which is not three integers.
          CURRENT_BASE="${CURRENT_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_BASE"

          SUFFIX="${{ inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            NEW_VERSION="${CURRENT_BASE}-${SUFFIX}"
          else
            case "${{ inputs.version_bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          CURRENT_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_code=$((CURRENT_CODE + 1))" >> "$GITHUB_OUTPUT"
          echo "$CURRENT_VERSION -> $NEW_VERSION"

      - name: Write the new version into the build file
        run: |
          sed -i 's/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.new_code }}/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "${{ steps.version.outputs.new_version }}"/' app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Decode the keystore
        if: steps.signing.outputs.signed == 'true'
        # Through `env`, not interpolated into the command text: a `${{ }}`
        # expression is substituted into the script itself, which is echoed in the
        # job log and in any shell trace, while "$KEYSTORE_BASE64" is only a name.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build a signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build the debug-signed APK instead
        if: steps.signing.outputs.signed == 'false'
        run: ./gradlew assembleDebug

      - name: Collect and rename the APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
            TAG="signed"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
            TAG="debug-signed"
          fi
          OUT="$RUNNER_TEMP/MaterialAgent-${VERSION}-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # The same bytes are published twice: as a `<apk>.sha256` asset the app
          # can fetch and parse without reading prose, and in the release body as
          # the fallback. Both are written here, next to the hash itself.
          echo "$SHA  $(basename "$OUT")" > "$OUT.sha256"
          echo "shasum=$OUT.sha256" >> "$GITHUB_OUTPUT"
          echo "$SHA"

      - name: Commit the version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push

      - name: Tag the release
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: MaterialAgent v${{ steps.version.outputs.new_version }}${{ inputs.prerelease == 'true' && ' (beta)' || '' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          body: |
            ## What's new in v${{ steps.version.outputs.new_version }}

            ${{ inputs.release_notes }}

            ${{ inputs.prerelease == 'true'
                && '### Beta build\n\nThis is a pre-release for testing. Expect rough edges: the app is being actively reworked and not everything is finished yet. The in-app updater on a beta build will offer the next beta, and a stable release once one exists.'
                || '' }}

            ---

            ### Install
            1. Download `${{ steps.apk.outputs.name }}` below
            2. Allow installing from this source if prompted
            3. Open it, point it at your Hermes gateway, connect

            ${{ steps.signing.outputs.signed == 'true'
                && 'Signed with the project release key.'
                || 'No release key is configured for this repository, so this APK is debug-signed. It installs fine and is suitable for testing, but it is not a store release.' }}

            ### Checksum
            ```
            SHA256: ${{ steps.apk.outputs.sha }}
            ```
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.shasum }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the keystore
        if: always()
        run: rm -f release.keystore
