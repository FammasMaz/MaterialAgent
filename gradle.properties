# Project-wide Gradle settings.
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# 4 GB heap is enough for this module and keeps CI/emulator runs from swapping.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7 builds API 36 fine; silence the warning until AGP is bumped.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
